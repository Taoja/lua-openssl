name: Test::Nginx

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENSSL_VERSION: "3.6.2"
      OPENSSL_PREFIX: "/usr/local/openssl-3.6.2"
      OPENSSL_SOURCE_DIR: "/tmp/openssl-3.6.2"
      OPENRESTY_VERSION: "1.27.1.2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            git \
            gnupg \
            libpcre3-dev \
            libreadline-dev \
            libssl-dev \
            perl \
            wget \
            zlib1g-dev

      - name: Build and install OpenSSL 3.6.2
        shell: bash
        run: |
          set -eux
          cd /tmp
          curl -fL "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz" -o openssl.tar.gz
          tar -xzf openssl.tar.gz
          rm -rf "${OPENSSL_SOURCE_DIR}"
          mv "openssl-${OPENSSL_VERSION}" "${OPENSSL_SOURCE_DIR}"
          cd "${OPENSSL_SOURCE_DIR}"
          ./Configure --prefix="${OPENSSL_PREFIX}" --libdir=lib --openssldir="${OPENSSL_PREFIX}/ssl" no-tests
          make -j"$(nproc)"
          sudo make install_sw

      - name: Build and install OpenResty against OpenSSL 3.6.2
        shell: bash
        run: |
          set -eux
          cd /tmp
          curl -fL "https://openresty.org/download/openresty-${OPENRESTY_VERSION}.tar.gz" -o openresty.tar.gz
          tar -xzf openresty.tar.gz
          cd "openresty-${OPENRESTY_VERSION}"
          ./configure \
            --prefix=/usr/local/openresty \
            --with-cc-opt="-I${OPENSSL_PREFIX}/include" \
            --with-ld-opt="-L${OPENSSL_PREFIX}/lib -Wl,-rpath,${OPENSSL_PREFIX}/lib" \
            --with-openssl="${OPENSSL_SOURCE_DIR}" \
            --with-openssl-opt="enable-ktls" \
            --with-pcre-jit \
            --with-http_ssl_module
          make -j"$(nproc)"
          sudo make install

      - name: Install Test::Nginx dependencies
        shell: bash
        run: |
          set -eux
          sudo apt-get install -y --no-install-recommends libtest-nginx-perl

      - name: Run Test::Nginx suite
        shell: bash
        run: |
          set -eux
          export PATH="/usr/local/openresty/bin:/usr/local/openresty/nginx/sbin:${PATH}"
          export LD_LIBRARY_PATH="${OPENSSL_PREFIX}/lib:${LD_LIBRARY_PATH:-}"
          export PKG_CONFIG_PATH="${OPENSSL_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export OPENSSL_CONF="${OPENSSL_PREFIX}/ssl/openssl.cnf"

          /usr/local/openresty/nginx/sbin/nginx -V
          /usr/local/openssl-3.6.2/bin/openssl version
          prove -v t/*.t
