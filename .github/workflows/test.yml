name: Test::Nginx

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      OPENSSL_VERSION: "3.6.3"
      OPENRESTY_VERSION: "1.27.1.2"
      OPENRESTY_PREFIX: "/home/runner/opt/openresty"   # 改到 $HOME，免 sudo

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl perl \
            cpanminus libipc-run-perl ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-cc-openresty
          max-size: 1G
          create-symlink: true
          evict-old-files: 'job'

      - name: Cache OpenResty
        id: cache-openresty
        uses: actions/cache@v4
        with:
          path: /home/runner/opt/openresty      # 必须与 OPENRESTY_PREFIX 逐字一致
          key: openresty-${{ runner.os }}-${{ env.OPENRESTY_VERSION }}-ssl${{ env.OPENSSL_VERSION }}

      - name: Build OpenResty with OpenSSL
        if: steps.cache-openresty.outputs.cache-hit != 'true'
        env:
          BUILD_DIR: ${{ runner.temp }}/or-build
        run: |
          set -eux
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"

          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_SLOPPINESS=time_macros

          curl -fL --retry 3 --retry-delay 5 \
            "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz" \
            -o openssl.tar.gz
          tar -xzf openssl.tar.gz
          OPENSSL_SRC="$BUILD_DIR/openssl-${OPENSSL_VERSION}"

          test -f "$OPENSSL_SRC/config"  || { echo "::error::OpenSSL 源码不完整"; exit 1; }
          test -d "$OPENSSL_SRC/include" || { echo "::error::OpenSSL 源码不完整"; exit 1; }

          curl -fL --retry 3 --retry-delay 5 \
            "https://openresty.org/download/openresty-${OPENRESTY_VERSION}.tar.gz" \
            -o openresty.tar.gz
          tar -xzf openresty.tar.gz

          cd "openresty-${OPENRESTY_VERSION}"
          ./configure \
            --prefix="$OPENRESTY_PREFIX" \
            --with-pcre-jit \
            --with-http_ssl_module \
            --with-http_v2_module \
            --with-stream \
            --with-stream_ssl_module \
            --with-openssl="$OPENSSL_SRC" \
            --with-openssl-opt="no-tests"
          make -j"$(nproc)"
          make install
          ccache -s

      - name: Assert OpenSSL linkage
        run: |
          set -eux
          "$OPENRESTY_PREFIX/nginx/sbin/nginx" -V
          "$OPENRESTY_PREFIX/nginx/sbin/nginx" -V 2>&1 \
            | grep -q "OpenSSL ${OPENSSL_VERSION}" \
            || { echo "::error::nginx 未链接 OpenSSL ${OPENSSL_VERSION}"; exit 1; }

      - name: Cache Perl modules
        uses: actions/cache@v4
        with:
          path: ~/perl5
          key: perl5-${{ runner.os }}-test-nginx

      - name: Install Test::Nginx
        run: |
          set -eux
          PERL_ARCH="$(perl -MConfig -e 'print $Config{archname}')"
          export PERL5LIB="$HOME/perl5/lib/perl5:$HOME/perl5/lib/perl5/$PERL_ARCH"
          # 供后续 step（prove）使用
          echo "PERL5LIB=$PERL5LIB" >> "$GITHUB_ENV"

          cpanm --notest --local-lib="$HOME/perl5" Test::Nginx IPC::Run \
            > build.log 2>&1 || (cat build.log && exit 1)

          # 自检：确认模块真的落在了 PERL5LIB 覆盖的路径下
          perl -MTest::Nginx::Socket -e 'print "OK $Test::Nginx::Socket::VERSION\n"'
          perl -MIPC::Run -e 'print "IPC::Run OK\n"'

      - name: Add nginx to PATH
        run: echo "$OPENRESTY_PREFIX/nginx/sbin" >> "$GITHUB_PATH"

      - name: Run tests
        run: |
          set -eux
          prove -r -v t

      - name: Upload error logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nginx-error-logs
          path: t/servroot/logs/
          if-no-files-found: ignore