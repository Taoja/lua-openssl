name: Test::Nginx

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENSSL_VERSION: "3.6.2"
      OPENSSL_PREFIX: "/usr/local/openssl-3.6.2"
      OPENSSL_SOURCE_DIR: "/tmp/openssl-3.6.2"
      OPENRESTY_VERSION: "1.27.1.2"

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git gnupg \
            libpcre3-dev libreadline-dev libssl-dev perl wget zlib1g-dev

      - name: Build OpenSSL 3.6.2
        run: |
          set -eux
          cd /tmp
          curl -fL "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz" -o openssl.tar.gz
          tar -xzf openssl.tar.gz
          cd "${OPENSSL_SOURCE_DIR}"
          ./Configure
          make
          sudo make install

      - name: Build OpenResty
        run: |
          set -eux
          cd /tmp
          curl -fL "https://openresty.org/download/openresty-${OPENRESTY_VERSION}.tar.gz" -o openresty.tar.gz
          tar -xzf openresty.tar.gz
          cd "openresty-${OPENRESTY_VERSION}"
          ./configure \
            --prefix=/usr/local/openresty \
            --with-pcre-jit \
            --with-http_ssl_module
          make -j"$(nproc)"
          sudo make install

      - name: Install Test::Nginx
        run: sudo apt-get install -y --no-install-recommends libtest-nginx-perl

      - name: Run tests
        run: |
          set -eux

          /usr/local/openresty/nginx/sbin/nginx -V
          /usr/local/openssl-3.6.2/bin/openssl version
          prove -v t/*.t
